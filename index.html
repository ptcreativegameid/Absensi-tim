<title>Absensi · PT CREATIVE GAME INDONESIA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1EE;--cd:#fff;--ink:#30211F;--mu:#6B5A55;--ln:#E4D9D2;--nv:#30211F;--ac:#C9955C;--a2:#E5B875;--on:#241817;--hf:'Plus Jakarta Sans',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1B1312;--cd:#2A1D1B;--ink:#F6F1EE;--mu:#CDBFB8;--ln:#4A3835;--nv:#241817;--ac:#E5B875;--a2:#C9955C;--on:#171515}}
:root[data-theme=dark]{--bg:#1B1312;--cd:#2A1D1B;--ink:#F6F1EE;--mu:#CDBFB8;--ln:#4A3835;--nv:#241817;--ac:#E5B875;--a2:#C9955C;--on:#171515}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}
body.ex{--hf:'Cormorant Garamond',Georgia,serif;background:radial-gradient(120% 50% at 50% 0,#3A2A27,var(--bg) 60%)}
.hd{display:flex;align-items:center;gap:12px;padding:16px 20px}
.lg{background:#F6F1EE;border-radius:16px;padding:3px}.lg img{display:block;width:52px;height:52px;object-fit:contain}
.co{font-weight:800;font-size:12px;letter-spacing:.16em;color:var(--ink)}
#app{max-width:560px;margin:0 auto;padding:0 20px 120px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font:800 26px/1.25 var(--hf)}body.ex h1{font-weight:600;font-size:36px}
.mu,small{color:var(--mu);font-size:13px;font-weight:600}small{display:block}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:22px;padding:16px 18px}
.ck{background:var(--nv);color:#F6F1EE;border:0}.ck small{color:#CDBFB8}
.clk{font:800 52px/1.15 var(--hf);font-variant-numeric:tabular-nums;color:#F6F1EE}body.ex .clk{font-weight:400;font-size:76px}
.big{font:800 30px var(--hf)}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.row2{display:flex;justify-content:space-between;gap:8px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}.rd{display:inline-flex;gap:8px;align-items:center;min-height:44px;margin:0}
input,select,textarea{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--ln);border-radius:14px;background:var(--bg);color:var(--ink);font:500 15px 'Plus Jakarta Sans',sans-serif}
input[type=radio]{width:20px;min-height:20px}textarea{min-height:84px}
.tr{display:grid;gap:8px;margin:10px 0}
.b,.b2{display:block;width:100%;min-height:56px;border-radius:18px;border:0;font:800 16px 'Plus Jakarta Sans',sans-serif;text-align:center;text-decoration:none;padding:16px;cursor:pointer;margin-top:10px}
.b{background:linear-gradient(135deg,var(--a2),var(--ac));color:var(--on);box-shadow:0 10px 24px rgba(201,149,92,.3)}
.b2{background:transparent;color:var(--ink);border:1.5px solid var(--ac);min-height:48px;font-size:14px}
button:disabled{opacity:.5}
.ch{display:inline-block;min-height:44px;padding:10px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:700 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.chs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.ch.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
span.ch{min-height:0;padding:4px 12px;cursor:default}.lt{background:#FBE4E1;color:#8C1D18;border-color:#FBE4E1}.ic{background:var(--nv);color:#F6F1EE}
.er{color:#C0392B;font-weight:700;font-size:13px}body.ex .er,:root[data-theme=dark] .er{color:#F2A29B}
canvas#sg{width:100%;height:150px;background:#fff;border:1.5px dashed var(--ac);border-radius:16px;touch-action:none;display:block}
#nv{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;display:flex;gap:6px;padding:8px;background:var(--nv);border-radius:24px}
#nv[hidden]{display:none}#nv button{flex:1;min-height:48px;border:0;border-radius:16px;background:none;color:#EEE6E0;font:700 14px 'Plus Jakarta Sans',sans-serif}
#nv button.on{background:var(--ac);color:var(--on)}
.rp{width:100%;border-radius:16px;border:1px solid var(--ln)}
.hd{flex-wrap:wrap}.hb{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.hb button{min-height:44px;padding:0 12px;border-radius:99px;border:1px solid var(--ln);background:var(--cd);color:var(--ink);font:700 12px 'Plus Jakarta Sans',sans-serif}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.gg button{min-height:56px;border-radius:14px;border:1px solid var(--ln);background:var(--bg)}.gg button.on{background:var(--ac);box-shadow:0 0 16px var(--ac)}
.gl{box-shadow:0 0 0 4px var(--a2),0 0 26px var(--ac)!important}
#gd{position:fixed;z-index:9;background:var(--ac);color:var(--on);border-radius:14px;padding:6px 6px 6px 12px;font-weight:700;font-size:13px;max-width:240px;animation:bob 1.1s ease-in-out infinite}#gd[hidden]{display:none}#gd::after{content:'';position:absolute;left:22px;bottom:-8px;border:8px solid transparent;border-top-color:var(--ac);border-bottom:0}#gd button{min-height:44px;border:0;background:rgba(0,0,0,.15);color:var(--on);border-radius:10px;font-weight:700;margin-left:6px}
@keyframes bob{50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){#gd{animation:none}}
.qp{width:120px;height:120px;border-radius:8px;border:1px solid var(--ln)}
body.adm #app{max-width:1000px}.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px}.g4+.g2{margin-top:12px}
details>summary{cursor:pointer;min-height:44px}
